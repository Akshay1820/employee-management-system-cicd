
name: Employee Management CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: spring-cicd
  ARTIFACT_NAME: employee-management-jar
  CONTAINER_NAME: spring-cont

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java on Runner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Building project
        run: mvn clean verify

      - name: Uploading jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/*.jar

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/

      - name: Creating Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Login to docker hub
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pushing image to docker hub
        if: ${{ github.event_name == 'push' }}
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    if: ${{ github.event_name == 'push' }}
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
  
            echo "Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
  
            # Save currently running image for rollback
            PREVIOUS_RUNNING_IMAGE=""
  
            if docker inspect ${{ env.CONTAINER_NAME }} >/dev/null 2>&1; then
              PREVIOUS_RUNNING_IMAGE=$(docker inspect \
                --format='{{.Config.Image}}' \
                ${{ env.CONTAINER_NAME }})
  
              echo "Current running image: $PREVIOUS_RUNNING_IMAGE"
            else
              echo "No existing container found. First deployment."
            fi
  
            # Stop and remove existing container
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
  
            echo "Starting new container..."
  
            docker run -d \
              --restart unless-stopped \
              -p 8082:8080 \
              --name ${{ env.CONTAINER_NAME }} \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
  
            echo "Performing health check..."
  
            for i in {1..12}; do
              if curl -f http://localhost:8082/actuator/health >/dev/null 2>&1; then
                echo "Deployment Successful."
                exit 0
              fi
  
              echo "Health Check Attempt: $i"
              echo "Application not ready. Retrying in 5 seconds..."
              sleep 5
            done
  
            echo "Deployment failed."
            echo "Stopping failed container..."
  
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
  
            ####################################################
            # Rollback
            ####################################################
  
            if [ -n "$PREVIOUS_RUNNING_IMAGE" ]; then
  
              echo "Rolling back to previous image: $PREVIOUS_RUNNING_IMAGE"
  
              docker run -d \
                --restart unless-stopped \
                -p 8082:8080 \
                --name ${{ env.CONTAINER_NAME }} \
                "$PREVIOUS_RUNNING_IMAGE"
  
              echo "Verifying rollback..."
  
              for i in {1..12}; do
                if curl -f http://localhost:8082/actuator/health >/dev/null 2>&1; then
                  echo "Rollback Successful."
                  echo "Application has been restored."
  
                  # Deployment failed even though rollback succeeded
                  exit 1
                fi
  
                echo "Rollback Health Check Attempt: $i"
                sleep 5
              done
  
              echo "Rollback also failed."
              exit 1
  
            else
  
              echo "Rollback not possible."
              echo "No previous deployment found."
              exit 1
  
            fi